  const name = sd.vendor || sd.name;
  if (!s || s.x.length === 0) return null;
  return {
    type: 'scatter', mode: 'lines',
    name: name,
    x: s.x, y: s.y,
    line: { color: sd.color, width: 2.5 },
    hovertemplate: `<b>${name}</b><br>%{x:.1f}분<br>%{y:${Y_FMT}} ${UNIT}<extra></extra>`,
  };
}).filter(Boolean);

Plotly.newPlot('chart', traces, {
  margin: { l: 72, r: 32, t: 60, b: 70 },
  title: {
    text: `<b>${TITLE}</b>  <span style="font-size:12px;color:#888">— 전체 비교 (마지막 30분)</span>`,
    font: { size: 15, color: '#1a1a1a', family: 'Malgun Gothic, Segoe UI, Arial' },
    x: 0.01, xanchor: 'left', y: 0.97, yanchor: 'top',
  },
  hovermode: 'x unified',
  plot_bgcolor: 'white', paper_bgcolor: 'white',
  legend: {
    orientation: 'h', x: 0, y: -0.12,
    bgcolor: 'rgba(255,255,255,0)',
    font: { size: 13, family: 'Malgun Gothic, Segoe UI, Arial' },
  },
  xaxis: {
    title: { text: '경과 시간 (분)', font: { size: 12, color: '#666' } },
    showgrid: true, gridcolor: '#f0f0f0',
    showline: true, linecolor: '#ddd', tickfont: { size: 11 },
  },
  yaxis: {
    title: { text: UNIT, font: { size: 12, color: '#666' } },
    showgrid: true, gridcolor: '#f0f0f0',
    showline: true, linecolor: '#ddd',
    zeroline: false, tickfont: { size: 11 },
    tickformat: TICK_FMT,
  },
  font: { family: 'Malgun Gothic, Segoe UI, Arial', size: 12 },
}, {
  responsive: true, displayModeBar: true,
  modeBarButtonsToRemove: ['select2d', 'lasso2d', 'autoScale2d'],
  displaylogo: false,
});
</script>
